# Pruebas en cada cambio. Publicación en Apps Script solo al crear una versión.
#
# - push a main / pull request: solo corre las pruebas.
# - etiqueta v1.2.3: pruebas, publica esa versión en Apps Script (misma URL)
#   y crea la Release en GitHub con las notas del CHANGELOG.
# - Run workflow (manual) sobre una etiqueta: vuelve a publicar esa versión.
#   Sirve para volver a una versión anterior.
#
# Configuración: ver "Actualización automática" en el README.
name: Probar y desplegar

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desplegar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Revisar que la etiqueta coincida con la versión
        if: github.ref_type == 'tag'
        env:
          VERSION_ETIQUETA: ${{ github.ref_name }}
        run: node tests/version.test.js
      - run: npm test

  desplegar:
    needs: pruebas
    if: github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Revisar que los secretos estén configurados
        id: revisar
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "::notice::Faltan los secretos CLASPRC_JSON, SCRIPT_ID o DEPLOYMENT_ID. No se publica en Apps Script. Ver README."
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        if: steps.revisar.outputs.listo == 'si'
        with:
          node-version: 24
      - name: Preparar clasp
        if: steps.revisar.outputs.listo == 'si'
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
      - name: Subir el código a Apps Script
        if: steps.revisar.outputs.listo == 'si'
        run: npx --yes @google/clasp@2.4.2 push --force
      - name: Publicar la versión (misma URL)
        if: steps.revisar.outputs.listo == 'si'
        run: npx --yes @google/clasp@2.4.2 deploy --deploymentId "$DEPLOYMENT_ID" --description "$VERSION"
      - name: Borrar credenciales
        if: always()
        run: rm -f ~/.clasprc.json .clasp.json
      - name: Crear la Release en GitHub
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notas: la sección de esta versión en el CHANGELOG.
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" { dentro = 1; next }
            dentro && /^## \[/ { exit }
            dentro && /^\[.*\]: http/ { exit }
            dentro { print }
          ' CHANGELOG.md > notas.md
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "La Release $VERSION ya existe."
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file notas.md --verify-tag
          fi
