# Pruebas en cada cambio. Publicación cuando cambia el número de versión.
#
# - pull request: solo corre las pruebas.
# - push a main: corre las pruebas. Si la versión de package.json todavía no
#   tiene etiqueta (por ejemplo v1.2.0), es una versión nueva: la publica en
#   Apps Script (misma URL), crea la etiqueta y la Release con las notas del
#   CHANGELOG.
# - Run workflow (manual) sobre una etiqueta: vuelve a publicar esa versión.
#   Sirve para volver a una versión anterior.
#
# Configuración: ver "Actualización automática" en el README.
name: Probar y desplegar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    # Las pruebas corren en paralelo. En un pull request, si llega un cambio nuevo,
    # se cancela la ejecución anterior (ya no sirve). En main nunca se cancela.
    concurrency:
      group: pruebas-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  publicar:
    needs: pruebas
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    # Solo la publicación va de a una: nunca dos a la vez sobre Apps Script.
    concurrency:
      group: publicar
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Empaquetar (src/ → dist/)
        run: node scripts/empaquetar.js

      - name: Ver si hay una versión nueva
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Volver a publicar $GITHUB_REF_NAME."
            echo "etiqueta=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publicar=si" >> "$GITHUB_OUTPUT"
            echo "nueva=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ETIQUETA="v$(node -p "require('./package.json').version")"
          echo "etiqueta=$ETIQUETA" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$ETIQUETA" > /dev/null; then
            echo "$ETIQUETA ya existe: no hay versión nueva que publicar."
            echo "publicar=no" >> "$GITHUB_OUTPUT"
            echo "nueva=no" >> "$GITHUB_OUTPUT"
          else
            echo "Versión nueva: $ETIQUETA"
            echo "publicar=si" >> "$GITHUB_OUTPUT"
            echo "nueva=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Revisar que los secretos estén configurados
        id: secretos
        if: steps.version.outputs.publicar == 'si'
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "::notice::Faltan los secretos CLASPRC_JSON, SCRIPT_ID o DEPLOYMENT_ID. No se publica en Apps Script. Ver README."
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar en Apps Script (misma URL)
        if: steps.secretos.outputs.listo == 'si'
        env:
          ETIQUETA: ${{ steps.version.outputs.etiqueta }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"dist"}' "$SCRIPT_ID" > .clasp.json
          npx --yes @google/clasp@2.4.2 push --force
          npx --yes @google/clasp@2.4.2 deploy --deploymentId "$DEPLOYMENT_ID" --description "$ETIQUETA"

      - name: Borrar credenciales
        if: always()
        run: rm -f ~/.clasprc.json .clasp.json

      - name: Crear la etiqueta y la Release
        if: steps.version.outputs.nueva == 'si'
        env:
          ETIQUETA: ${{ steps.version.outputs.etiqueta }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$ETIQUETA" -m "$ETIQUETA"
          git push origin "$ETIQUETA"
          # Notas: la sección de esta versión en el CHANGELOG.
          awk -v v="${ETIQUETA#v}" '
            $0 ~ "^## \\[" v "\\]" { dentro = 1; next }
            dentro && /^## \[/ { exit }
            dentro && /^\[.*\]: http/ { exit }
            dentro { print }
          ' CHANGELOG.md > notas.md
          printf '\n---\n**Instalación o actualización manual:** descargue `Codigo.gs`, `Formulario.html` y `appsscript.json` de esta página (ver README).\n' >> notas.md
          gh release create "$ETIQUETA" --title "$ETIQUETA" --notes-file notas.md --verify-tag --latest \
            dist/Codigo.gs dist/Formulario.html dist/appsscript.json
